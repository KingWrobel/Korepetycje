{% extends "base.html" %}

{% block title %}
{{ "Edytuj film" if video else "Dodaj film" }}
{% endblock %}

{% block content %}
<section class="section">
    <div class="container narrow">

        <a class="back-link" href="{{ url_for('student_detail', student_id=student.id) }}">
            ← Wróć do {{ student.name }}
        </a>

        <div class="panel">
            <span class="eyebrow">{{ student.name }}</span>
            <h1>{{ "Edytuj film" if video else "Dodaj film" }}</h1>

            <form method="post" class="form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label>
                    Przedmiot
                    <select name="subject" required>
                        <option
                            value="Matematyka"
                            {% if video and video.subject == "Matematyka" %}selected{% endif %}
                        >
                            Matematyka
                        </option>

                        <option
                            value="Geografia"
                            {% if video and video.subject == "Geografia" %}selected{% endif %}
                        >
                            Geografia
                        </option>
                    </select>
                </label>

                <label>
                    Tytuł
                    <input
                        type="text"
                        name="title"
                        required
                        value="{{ video.title if video else '' }}"
                    >
                </label>

                <label>
                    Opis
                    <textarea name="description" rows="5">{{ video.description if video and video.description else '' }}</textarea>
                </label>

                <label>
                    Link
                    <input
                        type="url"
                        name="url"
                        required
                        value="{{ video.url if video else '' }}"
                    >
                </label>

                <button class="btn" type="submit">
                    Zapisz film
                </button>

            </form>
        </div>
    </div>
</section>
{% endblock %}
